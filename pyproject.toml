[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roleradar-engine"
version = "1.0.0"
description = "Live job intelligence pipeline"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "PyYAML>=6.0,<7"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
